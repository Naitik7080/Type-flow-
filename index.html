<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Interactive Wallpaper</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#000 url("wallpaper.png") center center/cover no-repeat;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
}
.overlay{
  position:fixed;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.18));
  pointer-events:none;
}
.player{
  position:fixed;
  left:50%;bottom:42px;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;
  padding:12px 18px 12px 12px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50px;
  background:rgba(15,15,15,.45);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}
button{
  width:48px;height:48px;border:0;border-radius:50%;
  background:rgba(255,255,255,.9);
  color:#111;font-size:20px;cursor:pointer;
  transition:.2s transform,.2s background;
}
button:hover{transform:scale(1.08);background:#fff}
.info{color:#fff;min-width:180px}
.title{font-size:14px;font-weight:700}
.status{font-size:11px;opacity:.7;margin-top:3px}
.volume{width:85px;accent-color:#fff;cursor:pointer}
@media(max-width:600px){
  .info{min-width:120px}.volume{width:60px}
}
</style>
</head>
<body>
<div class="overlay"></div>

<div class="player">
  <button id="playBtn" aria-label="Play/Pause">▶</button>
  <div class="info">
    <div class="title">Barsaat Banjaare</div>
    <div class="status" id="status">Click play to start</div>
  </div>
  <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.75">
</div>

<audio id="song" src="Barsaat Banjaare.mp3" preload="auto"></audio>

<script>
const song = document.getElementById("song");
const playBtn = document.getElementById("playBtn");
const statusText = document.getElementById("status");
const volume = document.getElementById("volume");

song.volume = 0.75;

function updateUI(){
  if(song.paused){
    playBtn.textContent = "▶";
    statusText.textContent = "Paused";
  }else{
    playBtn.textContent = "Ⅱ";
    statusText.textContent = "Playing • Barsaat Banjaare";
  }
}

playBtn.addEventListener("click", async () => {
  try {
    if(song.paused) await song.play();
    else song.pause();
    updateUI();
  } catch(e) {
    statusText.textContent = "Unable to play the song";
  }
});

song.addEventListener("play", updateUI);
song.addEventListener("pause", updateUI);
song.addEventListener("ended", () => {
  playBtn.textContent = "▶";
  statusText.textContent = "Song finished";
});
volume.addEventListener("input", () => song.volume = volume.value);
</script>
</body>
</html>
